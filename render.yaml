services:
  - type: web
    name: mydairy-backend
    env: node
    plan: free
    buildCommand: npm install && npm install --prefix backend
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: mydairy-data
      mountPath: /var/data
      sizeGB: 1

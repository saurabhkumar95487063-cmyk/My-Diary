<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Diary — Login</title>
  <meta name="description" content="Login or create your My Diary account to access your personal notes and schedules." />
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg-base:      #0f0f13;
      --bg-elevated:  #17171f;
      --bg-card:      #1e1e2a;
      --border:       #2d2d3f;
      --border-focus: #6366f1;
      --text-primary: #f1f0ff;
      --text-secondary:#9898b8;
      --text-muted:   #5d5d7a;
      --accent:       #6366f1;
      --accent-light: #818cf8;
      --accent-glow:  rgba(99,102,241,0.25);
      --pink:         #ec4899;
      --red:          #ef4444;
      --green:        #10b981;
      --radius:       16px;
      --radius-sm:    10px;
      --transition:   0.2s cubic-bezier(0.4,0,0.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(99,102,241,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(236,72,153,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 20%, rgba(139,92,246,0.07) 0%, transparent 40%);
      animation: bgFloat 15s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }
    @keyframes bgFloat {
      0%   { transform: translate(0,0) rotate(0deg); }
      100% { transform: translate(30px, 20px) rotate(3deg); }
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.15; }
      90%  { opacity: 0.15; }
      100% { transform: translateY(-20px) rotate(720deg); opacity: 0; }
    }

    /* Auth wrapper */
    .auth-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      margin: auto 0;
    }

    /* Logo */
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeDown 0.5s ease;
    }
    .auth-logo .logo-emoji { font-size: 3rem; display: block; margin-bottom: 10px; }
    .auth-logo h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .auth-logo p { font-size: 0.85rem; color: var(--text-muted); }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Card */
    .auth-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
      animation: fadeUp 0.5s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 24px 14px; }
      .auth-logo { margin-bottom: 20px; }
      .auth-logo .logo-emoji { font-size: 2.2rem; margin-bottom: 4px; }
      .auth-logo h1 { font-size: 1.6rem; }
      .auth-card { padding: 24px 18px; border-radius: 20px; }
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 28px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all var(--transition);
      font-family: inherit;
    }
    .auth-tab.active {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      box-shadow: 0 4px 12px rgba(99,102,241,0.4);
    }

    /* Forms */
    .auth-form { display: none; }
    .auth-form.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 0.9rem;
      pointer-events: none;
      transition: color var(--transition);
    }
    .input-wrap:focus-within .input-icon { color: var(--accent-light); }

    .form-group input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px 12px 42px;
      color: var(--text-primary);
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: all var(--transition);
    }
    .form-group input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .form-group input::placeholder { color: var(--text-muted); }

    .pwd-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px;
      transition: color var(--transition);
    }
    .pwd-toggle:hover { color: var(--text-primary); }

    /* Submit Button */
    .btn-auth {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition);
      box-shadow: 0 4px 20px rgba(99,102,241,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-auth:hover {
      box-shadow: 0 8px 32px rgba(99,102,241,0.6);
      transform: translateY(-1px);
    }
    .btn-auth:active { transform: scale(0.98); }
    .btn-auth:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Error / Success message */
    .auth-message {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .auth-message.error {
      display: flex;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }
    .auth-message.success {
      display: flex;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.3);
      color: #6ee7b7;
    }

    /* Password strength */
    .pwd-strength {
      margin-top: 8px;
      display: none;
    }
    .pwd-strength.visible { display: block; }
    .pwd-strength-bar {
      height: 4px;
      border-radius: 4px;
      background: var(--border);
      overflow: hidden;
      margin-bottom: 4px;
    }
    .pwd-strength-fill {
      height: 100%;
      border-radius: 4px;
      transition: all 0.3s ease;
      width: 0%;
    }
    .pwd-strength-label { font-size: 0.72rem; color: var(--text-muted); }

    /* Divider */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Footer */
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .forgot-link-wrap {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .forgot-link {
      color: var(--accent-light);
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      transition: color var(--transition);
    }
    .forgot-link:hover {
      color: var(--pink);
      text-decoration: underline;
    }

    .forgot-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .forgot-modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }
    .forgot-modal {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }
    .forgot-modal-backdrop.open .forgot-modal {
      transform: scale(1);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Animated particles -->
  <div class="particles" id="particles"></div>

  <div class="auth-wrapper">
    <!-- Logo -->
    <div class="auth-logo">
      <img src="logo.png" alt="My Diary Logo" style="width:84px; height:84px; object-fit:contain; border-radius:20px; margin-bottom:8px; box-shadow: 0 8px 24px rgba(99,102,241,0.3);" />
      <h1>My Diary</h1>
      <p>Your personal space for notes & schedules</p>
    </div>

    <!-- Card -->
    <div class="auth-card">
      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">
          <i class="fa fa-sign-in-alt"></i> Login
        </button>
        <button class="auth-tab" id="registerTab" onclick="switchTab('register')">
          <i class="fa fa-user-plus"></i> Create Account
        </button>
      </div>

      <!-- Error/Success message -->
      <div class="auth-message" id="authMessage"></div>

      <!-- ── LOGIN FORM ── -->
      <form class="auth-form active" id="loginForm" autocomplete="on" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email / Phone Number</label>
          <div class="input-wrap">
            <i class="fa fa-user-circle input-icon"></i>
            <input type="text" id="loginEmail" name="email" placeholder="you@example.com or 9876543210" autocomplete="username" required />
          </div>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <i class="fa fa-lock input-icon"></i>
            <input type="password" id="loginPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" class="pwd-toggle" onclick="togglePwd('loginPassword', this)">
              <i class="fa fa-eye"></i>
            </button>
          </div>
          <div class="forgot-link-wrap">
            <a href="#" class="forgot-link" onclick="toggleForgotModal(true); return false;">Forgot / Reset Password?</a>
          </div>
        </div>
        <button type="submit" class="btn-auth" id="loginBtn">
          <i class="fa fa-sign-in-alt"></i> Login to My Diary
        </button>
      </form>

      <!-- ── REGISTER FORM ── -->
      <form class="auth-form" id="registerForm" autocomplete="on" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="regName">Full Name</label>
          <div class="input-wrap">
            <i class="fa fa-user input-icon"></i>
            <input type="text" id="regName" name="name" placeholder="Your name" autocomplete="name" required />
          </div>
        </div>
        <div class="form-group">
          <label for="regEmail">Email / Phone Number</label>
          <div class="input-wrap">
            <i class="fa fa-at input-icon"></i>
            <input type="text" id="regEmail" name="email" placeholder="you@example.com or 9876543210" autocomplete="username" required />
          </div>
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <div class="input-wrap">
            <i class="fa fa-lock input-icon"></i>
            <input type="password" id="regPassword" name="password" placeholder="Min. 6 characters" autocomplete="new-password" required oninput="checkStrength(this.value)" />
            <button type="button" class="pwd-toggle" onclick="togglePwd('regPassword', this)">
              <i class="fa fa-eye"></i>
            </button>
          </div>
          <div class="pwd-strength" id="pwdStrength">
            <div class="pwd-strength-bar">
              <div class="pwd-strength-fill" id="pwdFill"></div>
            </div>
            <span class="pwd-strength-label" id="pwdLabel">Weak</span>
          </div>
        </div>
        <div class="form-group">
          <label for="regConfirm">Confirm Password</label>
          <div class="input-wrap">
            <i class="fa fa-lock input-icon"></i>
            <input type="password" id="regConfirm" name="confirm" placeholder="Re-enter password" autocomplete="new-password" required />
            <button type="button" class="pwd-toggle" onclick="togglePwd('regConfirm', this)">
              <i class="fa fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-auth" id="registerBtn">
          <i class="fa fa-user-plus"></i> Create My Diary Account
        </button>
      </form>

      <div class="auth-footer">
        🔒 Your data is private and secure. Only you can see your diary.
      </div>
  </div>

  <!-- ── RESET PASSWORD MODAL ── -->
  <div class="forgot-modal-backdrop" id="forgotModal">
    <div class="forgot-modal">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
        <h3 style="font-family:'Playfair Display',serif; font-size:1.3rem; color:var(--text-primary);">Reset Password</h3>
        <button type="button" class="pwd-toggle" onclick="toggleForgotModal(false)" style="position:static; font-size:1.1rem;">✕</button>
      </div>
      <div class="auth-message" id="resetMessage"></div>
      <form onsubmit="handleResetPassword(event)">
        <div class="form-group">
          <label for="resetEmail">Email or Phone Number</label>
          <div class="input-wrap">
            <i class="fa fa-user-circle input-icon"></i>
            <input type="text" id="resetEmail" placeholder="Registered email or phone" required />
          </div>
        </div>
        <div class="form-group">
          <label for="resetNewPassword">New Password</label>
          <div class="input-wrap">
            <i class="fa fa-lock input-icon"></i>
            <input type="password" id="resetNewPassword" placeholder="Min. 6 characters" required />
            <button type="button" class="pwd-toggle" onclick="togglePwd('resetNewPassword', this)">
              <i class="fa fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-auth" id="resetBtn" style="margin-top:14px;">
          <i class="fa fa-key"></i> Update Password
        </button>
      </form>
    </div>
  </div>

  <script>
    function formatApiEndpoint(url) {
      if (!url) return '';
      let clean = url.trim().replace(/\/+$/, '');
      if (!clean.endsWith('/api')) clean += '/api';
      return clean;
    }

    function getApiUrl() {
      const DEFAULT_RENDER_API = 'https://my-diary-ksur.onrender.com/api';
      const isCapacitor = !!(window.Capacitor || window.location.protocol === 'file:' || (window.Capacitor && window.Capacitor.isNativePlatform()));

      let customUrl = localStorage.getItem('diary_api_url');
      if (customUrl && customUrl.trim()) {
        if (isCapacitor && (customUrl.includes('localhost') || customUrl.includes('127.0.0.1') || customUrl.includes('172.') || customUrl.includes('192.168.'))) {
          localStorage.removeItem('diary_api_url');
        } else {
          return formatApiEndpoint(customUrl);
        }
      }

      if (window.RENDER_API_URL || window.MYDIARY_API_URL) {
        return formatApiEndpoint(window.RENDER_API_URL || window.MYDIARY_API_URL);
      }

      if (isCapacitor) {
        return DEFAULT_RENDER_API;
      }

      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (isLocalhost && window.location.port && window.location.port !== '80' && window.location.port !== '443') {
        return `${window.location.protocol}//${window.location.hostname}:3000/api`;
      }

      return DEFAULT_RENDER_API;
    }
    const API = getApiUrl();

    function configureApiServer() {
      const current = localStorage.getItem('diary_api_url') || API;
      const input = prompt('Enter backend API Server URL (e.g., https://mydairy-backend.onrender.com):', current);
      if (input !== null) {
        if (input.trim() === '') {
          localStorage.removeItem('diary_api_url');
        } else {
          localStorage.setItem('diary_api_url', formatApiEndpoint(input));
        }
        window.location.reload();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const display = document.getElementById('currentApiDisplay');
      if (display) display.textContent = API;
    });

    // ── Forgot Password Modal Toggle ──────────────────────
    function toggleForgotModal(show) {
      const modal = document.getElementById('forgotModal');
      const msg = document.getElementById('resetMessage');
      if (msg) msg.className = 'auth-message';
      if (show) {
        modal.classList.add('open');
        document.getElementById('resetEmail').value = document.getElementById('loginEmail').value.trim();
        document.getElementById('resetNewPassword').value = '';
      } else {
        modal.classList.remove('open');
      }
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      const newPassword = document.getElementById('resetNewPassword').value;
      const btn = document.getElementById('resetBtn');
      const msgEl = document.getElementById('resetMessage');

      if (!email || !newPassword) {
        msgEl.className = 'auth-message error';
        msgEl.innerHTML = '<i class="fa fa-exclamation-circle"></i> Please fill in all fields';
        return;
      }
      if (newPassword.length < 6) {
        msgEl.className = 'auth-message error';
        msgEl.innerHTML = '<i class="fa fa-exclamation-circle"></i> Password must be at least 6 characters';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Resetting...';

      try {
        const res = await fetch(`${API}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, newPassword })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          msgEl.className = 'auth-message error';
          msgEl.innerHTML = `<i class="fa fa-exclamation-circle"></i> ${data.message || 'Reset failed'}`;
          return;
        }

        msgEl.className = 'auth-message success';
        msgEl.innerHTML = `<i class="fa fa-check-circle"></i> ${data.message}`;
        setTimeout(() => {
          toggleForgotModal(false);
          document.getElementById('loginEmail').value = email;
          document.getElementById('loginPassword').value = '';
          showMessage('Password reset successfully! Please login with your new password.', 'success');
        }, 1500);
      } catch (err) {
        msgEl.className = 'auth-message error';
        msgEl.innerHTML = '<i class="fa fa-exclamation-circle"></i> Cannot connect to server';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-key"></i> Update Password';
      }
    }

    // ── Redirect if already logged in ──────────────────────
    const token = localStorage.getItem('diary_token');
    if (token) {
      fetch(`${API}/auth/me`, { headers: { Authorization: `Bearer ${token}` } })
        .then(r => r.json())
        .then(d => { if (d.success) window.location.href = 'app.html'; })
        .catch(() => {});
    }

    // ── Tab Switch ─────────────────────────────────────────
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.getElementById(tab + 'Tab').classList.add('active');
      document.getElementById(tab + 'Form').classList.add('active');
      hideMessage();
    }

    // ── Message ────────────────────────────────────────────
    function showMessage(msg, type = 'error') {
      const el = document.getElementById('authMessage');
      el.className = `auth-message ${type}`;
      el.innerHTML = `<i class="fa fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${msg}`;
    }
    function hideMessage() {
      document.getElementById('authMessage').className = 'auth-message';
    }

    // ── Password toggle ────────────────────────────────────
    function togglePwd(inputId, btn) {
      const input = document.getElementById(inputId);
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.innerHTML = `<i class="fa fa-eye${isText ? '' : '-slash'}"></i>`;
    }

    // ── Password strength ──────────────────────────────────
    function checkStrength(val) {
      const el = document.getElementById('pwdStrength');
      const fill = document.getElementById('pwdFill');
      const label = document.getElementById('pwdLabel');
      if (!val) { el.classList.remove('visible'); return; }
      el.classList.add('visible');

      let score = 0;
      if (val.length >= 6)  score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^a-zA-Z0-9]/.test(val)) score++;

      const levels = [
        { pct: '20%', color: '#ef4444', text: 'Very Weak' },
        { pct: '40%', color: '#f59e0b', text: 'Weak' },
        { pct: '60%', color: '#eab308', text: 'Fair' },
        { pct: '80%', color: '#10b981', text: 'Strong' },
        { pct: '100%', color: '#6366f1', text: 'Very Strong' },
      ];
      const lvl = levels[Math.min(score, 4)];
      fill.style.width = lvl.pct;
      fill.style.background = lvl.color;
      label.textContent = lvl.text;
      label.style.color = lvl.color;
    }

    // ── Login ──────────────────────────────────────────────
    async function handleLogin(e) {
      e.preventDefault();
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn      = document.getElementById('loginBtn');

      if (!email || !password) { showMessage('Please fill in all fields'); return; }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Logging in...';
      hideMessage();

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!data.success) {
          showMessage(data.message || 'Login failed');
          return;
        }

        // Save token & user info
        localStorage.setItem('diary_token', data.token);
        localStorage.setItem('diary_user', JSON.stringify(data.user));

        showMessage('Login successful! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'app.html'; }, 800);
      } catch (err) {
        showMessage('Cannot connect to server. Make sure the server is running.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-sign-in-alt"></i> Login to My Diary';
      }
    }

    // ── Register ───────────────────────────────────────────
    async function handleRegister(e) {
      e.preventDefault();
      const name     = document.getElementById('regName').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm  = document.getElementById('regConfirm').value;
      const btn      = document.getElementById('registerBtn');

      if (!name || !email || !password || !confirm) { showMessage('Please fill in all fields'); return; }
      if (password.length < 6) { showMessage('Password must be at least 6 characters'); return; }
      if (password !== confirm) { showMessage('Passwords do not match'); return; }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Creating account...';
      hideMessage();

      try {
        const res = await fetch(`${API}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();

        if (!data.success) {
          showMessage(data.message || 'Registration failed');
          return;
        }

        localStorage.setItem('diary_token', data.token);
        localStorage.setItem('diary_user', JSON.stringify(data.user));

        showMessage(`Welcome, ${data.user.name}! Redirecting...`, 'success');
        setTimeout(() => { window.location.href = 'app.html'; }, 900);
      } catch (err) {
        showMessage('Cannot connect to server. Make sure the server is running.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-user-plus"></i> Create My Diary Account';
      }
    }

    // ── Floating particles ─────────────────────────────────
    const container = document.getElementById('particles');
    const emojis = ['📔','📝','✨','⭐','🌸','📅','💜','🌙'];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      const size = Math.random() * 24 + 12;
      p.className = 'particle';
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        width: ${size}px;
        height: ${size}px;
        font-size: ${size * 0.8}px;
        animation-duration: ${Math.random() * 12 + 10}s;
        animation-delay: ${Math.random() * 8}s;
        background: none;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.2;
      `;
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      container.appendChild(p);
    }
  </script>
</body>
